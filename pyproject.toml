[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "datacollaborationanalysis"
version = "0.1.0"
description = "Data Collaboration Analysis"
readme = "README.md"
requires-python = ">=3.9.2,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "suetake89", email = "suetake89@gmail.com" }]
# 旧 [tool.poetry.dependencies] を移行（python 行は削除）
dependencies = [
  "pandas>=2.0.1,<3.0.0",
  "numpy>=1.24.3,<2.0.0",
  "seaborn>=0.12.2,<0.13.0",
  "tqdm>=4.65.0,<5.0.0",
  "category-encoders>=2.6.0,<3.0.0",
  "optuna>=3.1.1,<4.0.0",
  "scikit-learn>=1.2.2,<2.0.0",
  "matplotlib>=3.7.1,<4.0.0",
  "pyyaml>=6.0,<7.0",
  "scipy>=1.11.2,<2.0.0",
  "notebook>=7.4.3,<8.0.0",
  "ipykernel>=6.29.5,<7.0.0",
  "xlrd>=2.0.2,<3.0.0",
  "pytdc==0.3.6",
  "torch>=2.8.0,<3.0.0",
  "mlflow>=3.1.4",
  "hydra-core>=1.3,<2.0",
  "pytest>=8.4.2",
  "umap-learn>=0.5.6,<0.6.0", # ← 追加
  "pynndescent>=0.5.11,<0.6.0", # ← 推奨（UMAP近傍探索）
  "medmnist>=3.0.2",
]

[project.optional-dependencies]
# 旧 [tool.poetry.group.dev.dependencies] と [dependency-groups].dev を統合
dev = [
  "pytest>=8.4.2",
  "isort>=5.12.0,<6.0.0",
  "flake8>=6.0.0,<7.0.0",
  "autoflake>=2.1.1,<3.0.0",
  "black>=23.3.0,<24.0.0",
  "ruff>=0.6.0",       # ← 追加
  "pre-commit>=3.0.0", # ← 追加
]

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"

[tool.hatch.build.targets.wheel]
packages = ["datacollaborationanalysis"]

[tool.pytest.ini_options]
markers = [
  "slow: mark tests that take a long time to finish",
]
